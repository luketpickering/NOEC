<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>LEADERBOARD</title>
    <link href='https://fonts.googleapis.com/css?family=Orbitron' rel='stylesheet' type='text/css'>
    <link rel="stylesheet" href="style.css">
    <script src="d3.v7.min.js"></script>
    <script src="jquery-4.0.0.min.js"></script>
    <!--<script type="module" src="noec_frontend.js"></script> -->
    
  </head>
  <body>
    <h1 class="lb">Leaderboard</h1>
    <table>
      <tr>
	<th>Name</th>
	<th>Score</th>
	<th>Settings</th>
      </tr>
      {% for score in scores %}
    <tr>
    <td> {{score.username}} </td>
    <td> {{score.score}} </td>
    <td>
    {% if score.hist %}
       <svg height="20" width="20" xmlns="http://www.w3.org/2000/svg">
	 <circle r="10" cx="10" cy="10" fill="orange" />
       </svg>
    {% else %}
      <svg height="20" width="20" xmlns="http://www.w3.org/2000/svg">
	 <circle r="10" cx="10" cy="10" fill="black" />
      </svg>
    {% endif %}
    {% if score.noise %}
      <svg height="20" width="20" xmlns="http://www.w3.org/2000/svg">
	 <circle r="10" cx="10" cy="10" fill="deeppink" />
       </svg>
    {% else %}
      <svg height="20" width="20" xmlns="http://www.w3.org/2000/svg">
	 <circle r="10" cx="10" cy="10" fill="black" />
      </svg>
    {% endif %}
    {% if score.ml %}
      <svg height="20" width="20" xmlns="http://www.w3.org/2000/svg">
	 <circle r="10" cx="10" cy="10" fill="lime" />
      </svg>
    {% else %}
      <svg height="20" width="20" xmlns="http://www.w3.org/2000/svg">
	 <circle r="10" cx="10" cy="10" fill="black" />
      </svg>
    {% endif %}
    {% if score.slow_load %}
     <svg height="20" width="20" xmlns="http://www.w3.org/2000/svg">
	 <circle r="10" cx="10" cy="10" fill="darkviolet" />
       </svg> 
     {% else %}
      <svg height="20" width="20" xmlns="http://www.w3.org/2000/svg">
	 <circle r="10" cx="10" cy="10" fill="black" />
      </svg>
    {% endif %}
    </td>
    </tr>
    {% endfor %}
    </table>
    <div id="container"></div>
  </body>
</html>
